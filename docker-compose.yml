services:
  rapla-proxy:
    image: ghcr.io/pilovr/rapla-splitter:latest
    # Lokal bauen statt Image ziehen:  build: .
    container_name: rapla-proxy
    restart: unless-stopped
    # Optional: eigene config.yaml statt der im Image eingebauten:
    # volumes:
    #   - ./config.yaml:/app/config.yaml:ro
    networks: [tunnel]
    # Nur lokal erreichbar (zum Testen). Der Tunnel nutzt das Docker-Netz: http://rapla-proxy:8000
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

networks:
  tunnel:
    external: true
    name: cloudflared_default   # Name des Docker-Netzes, in dem dein cloudflared-Container haengt
