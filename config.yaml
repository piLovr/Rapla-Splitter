# Rapla iCal Filter Proxy – Konfiguration

# Feste Upstream-Adresse. Nur "user" und "file" kommen aus der Proxy-URL,
# der Host kann also nicht per URL umgebogen werden.
upstream: "https://rapla.dhbw.de/rapla/ical"

# So lange wird der Rapla-Feed eines Kurses zwischengespeichert (Sekunden), 43200 = 12 h = zweimal am Tag.
# Der Cache gilt pro Kurs ("file"), egal wie viele URLs/Wahlfaecher darauf zeigen, und liegt im Arbeitsspeicher
# (Container-Neustart leert ihn). Ist Rapla nicht erreichbar, wird die letzte gute Kopie ausgeliefert und
# Rapla erst nach retry_seconds wieder gefragt.
cache_seconds: 43200
retry_seconds: 900

# Unbekannte Kurse/User (Rapla antwortet 404) werden so lange nicht erneut bei Rapla erfragt.
negative_cache_seconds: 600

# Schutz vor Missbrauch (pro Client-IP, im Arbeitsspeicher). 0 schaltet ein Limit ab.
# requests_per_minute: alle Anfragen an den Proxy (429 bei Ueberschreitung)
# upstream_per_10min:  echte Rapla-Abrufe (Cache-Treffer zaehlen nicht); wer mehr braucht, ist fuer ban_seconds gesperrt
rate_limit:
  requests_per_minute: 240
  upstream_per_10min: 20
  ban_seconds: 1800

# Hinter dem Cloudflare Tunnel steht die echte Client-IP in diesem Header (leer = Verbindungs-IP nutzen).
# Nur sinnvoll, wenn der Proxy ausschliesslich ueber den Tunnel erreichbar ist.
client_ip_header: CF-Connecting-IP

# Wahlfaecher werden pro Kurs automatisch erkannt (Faecher, die im selben Kurs parallel laufen, siehe wahlfaecher.py).
# Hier nur Ergaenzungen fuer Faecher, die die Erkennung nicht findet (z. B. weil Rapla noch keine Termine hat).
# Eintrag = Teil des Titels in Rapla; Leerzeichen, Gross-/Kleinschreibung, Umlaute und roemische Zahlen sind egal.
# Ein Eintrag zaehlt nur fuer Kurse, in deren Plan er vorkommt.
wahlfach_pool:
  - Signale und Systeme
  - Digitale Währungssysteme
  - Geschäftsprozesse
  - Webengineering 3
  - Linux Basics
  # 4. Semester (Wahlmodul 2. Studienjahr)
  - OO Best Practice
  - Workflow
  - Anwendungen der Robotik

# Optionale Zusatzfaecher: fehlen standardmaessig, mit ?<schluessel>=1 sind sie dabei.
# (gilt fuer Vorlesungen und die passende Klausur)
optional:
  ccna: CCNA

# Termine, die in KEINEM Kalender landen sollen (Teil des Titels, Schreibweise egal).
# Sie landen in rest.ics. Alles andere, was weder Vorlesung noch Pruefung ist, kommt in veranstaltungen.ics.
ignore:
  - Neujahr
  - Heilige Drei Koenige
  - Fschingsdienstag
  - Faschingsdienstag
  - Karfreitag
  - Ostermontag
  - Tag der Arbeit
  - Christi Himmelfahrt
  - Pfingstmontag
  - Fronleichnam
  - Tag der Deutschen Einheit
  - Allerheiligen
  - Buss- und Bettag
  - Weihnachten
  - Feiertag
  - Beginn Theorie
  - Klausurwoche

# Zuordnung der Rapla-Kategorien (sind die Farben im Rapla-Kalender)
categories:
  lecture: Lehrveranstaltung   # grau
  exam: Prüfung                # rot
  other: Sonstiger Termin      # blau; 

# Pruefungen, deren Titel eines davon enthaelt, sind Nachklausuren: sie landen nur dann in klausuren.ics,
# wenn man sie per ?nach=Stichwort (oder nach=alle) auswaehlt, sonst in rest.ics
nachklausur_match:
  - geladene
  - Wdh
  - Wiederholung
  - Nachklausur
  - Nach- bzw.
